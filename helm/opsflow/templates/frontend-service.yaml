apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsflow.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opsflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
