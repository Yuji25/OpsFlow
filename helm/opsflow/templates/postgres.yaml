apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsflow.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" (.Values.postgres.username | urlquery | replace "+" "%20") (.Values.postgres.password | urlquery | replace "+" "%20") (include "opsflow.fullname" .) (.Values.postgres.database | urlquery | replace "+" "%20") | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsflow.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opsflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opsflow.fullname" . }}-postgres-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsflow.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opsflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "opsflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ include "opsflow.fullname" . }}-postgres, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "opsflow.fullname" . }}-postgres, key: password}
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "opsflow.fullname" . }}-postgres-data
          {{- else }}
          emptyDir: {}
          {{- end }}
