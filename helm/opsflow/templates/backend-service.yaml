apiVersion: v1
kind: Service
metadata:
  # The published frontend Nginx config resolves backend:8000 in its namespace.
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opsflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: 8000, targetPort: http}
