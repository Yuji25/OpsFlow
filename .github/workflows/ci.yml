name: OpsFlow CI and GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Backend tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Run isolated backend tests
        run: python -m pytest -v
        working-directory: backend

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  build_scan:
    name: Build images and enforce Trivy gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_scan: ${{ steps.backend_scan.outcome }}
      frontend_scan: ${{ steps.frontend_scan.outcome }}
    env:
      PUBLISH_IMAGES: ${{ github.repository == 'Yuji25/OpsFlow' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare lowercase image references
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/opsflow-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/opsflow-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/trivy-reports"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image locally
        id: backend_build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ steps.images.outputs.backend }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=opsflow-backend
          cache-to: type=gha,mode=max,scope=opsflow-backend

      - name: Build frontend image locally
        id: frontend_build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ steps.images.outputs.frontend }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=opsflow-frontend
          cache-to: type=gha,mode=max,scope=opsflow-frontend

      # Both scans are blocking. A failed backend scan must not hide frontend results.
      - name: Trivy backend HIGH and CRITICAL gate
        id: backend_scan
        if: ${{ !cancelled() && steps.backend_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.images.outputs.backend }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: ${{ runner.temp }}/trivy-reports/backend.txt

      - name: Trivy frontend HIGH and CRITICAL gate
        id: frontend_scan
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.images.outputs.frontend }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: ${{ runner.temp }}/trivy-reports/frontend.txt

      - name: Print available vulnerability reports
        if: ${{ always() }}
        shell: bash
        run: |
          for service in backend frontend; do
            report="$RUNNER_TEMP/trivy-reports/${service}.txt"
            if [[ -f "$report" ]]; then
              echo "::group::Trivy ${service} report (blocking HIGH/CRITICAL gate)"
              cat "$report"
              echo "::endgroup::"
            else
              echo "No report generated for ${service}; inspect build/scan logs."
            fi
          done

      - name: Retain vulnerability reports, including on scan failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports-${{ github.sha }}
          path: ${{ runner.temp }}/trivy-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Save the exact scanned images for publication
        if: ${{ success() && env.PUBLISH_IMAGES == 'true' }}
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          docker save --output "$RUNNER_TEMP/images/backend.tar" "$BACKEND_IMAGE"
          docker save --output "$RUNNER_TEMP/images/frontend.tar" "$FRONTEND_IMAGE"
          du -h "$RUNNER_TEMP/images/"*.tar

      - name: Transfer scanned images to the publication job
        if: ${{ success() && env.PUBLISH_IMAGES == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: scanned-images-${{ github.sha }}
          path: ${{ runner.temp }}/images/*.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish scanned SHA-tagged images to GHCR
    needs: [validate, build_scan]
    if: >-
      ${{ needs.validate.result == 'success' && needs.build_scan.result == 'success' &&
          needs.build_scan.outputs.backend_scan == 'success' &&
          needs.build_scan.outputs.frontend_scan == 'success' &&
          github.repository == 'Yuji25/OpsFlow' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # No checkout, application execution, or scanner runs in the write-enabled job.
      - name: Download scanned images from this workflow run
        uses: actions/download-artifact@v8
        with:
          name: scanned-images-${{ github.sha }}
          path: ${{ runner.temp }}/images
          digest-mismatch: error

      - name: Load scanned images without rebuilding
        run: |
          docker load --input "$RUNNER_TEMP/images/backend.tar"
          docker load --input "$RUNNER_TEMP/images/frontend.tar"

      - name: Log in to GHCR with the built-in token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit-SHA tags only
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for service in backend frontend; do
            image="ghcr.io/${owner}/opsflow-${service}:${GITHUB_SHA}"
            docker push "$image"
            echo "Published: \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
          done
