# grafana-community/grafana 13.5.0; local-only, authenticated port-forward access.
fullnameOverride: opsflow-grafana
replicas: 1
rbac:
  create: false
automountServiceAccountToken: false
service:
  type: ClusterIP
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
persistence:
  enabled: false
testFramework:
  enabled: false
# The chart generates the admin password in a Kubernetes Secret; no password here.
grafana.ini:
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_updates: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: OpsFlow Prometheus
        uid: opsflow-prometheus
        type: prometheus
        access: proxy
        url: http://opsflow-prometheus.opsflow-monitoring.svc.cluster.local
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: opsflow
        orgId: 1
        folder: OpsFlow
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards/opsflow
dashboardsConfigMaps:
  opsflow: opsflow-dashboard
