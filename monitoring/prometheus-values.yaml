# prometheus-community/prometheus 29.36.1; local Minikube demonstration.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  fullnameOverride: opsflow-prometheus
  replicaCount: 1
  strategy:
    type: Recreate
  retention: 6h
  retentionSize: 512MB
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
  persistentVolume:
    enabled: true
    size: 2Gi
    annotations:
      helm.sh/resource-policy: keep
  service:
    type: ClusterIP
    servicePort: 80

configmapReload:
  prometheus:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}

# Keep self-scraping; disable unrelated cluster-wide jobs from the chart.
scrapeConfigs:
  kubernetes-api-servers: {enabled: false}
  kubernetes-nodes: {enabled: false}
  kubernetes-nodes-cadvisor: {enabled: false}
  kubernetes-service-endpoints: {enabled: false}
  kubernetes-service-endpoints-slow: {enabled: false}
  prometheus-pushgateway: {enabled: false}
  kubernetes-services: {enabled: false}
  kubernetes-pods: {enabled: false}
  kubernetes-pods-slow: {enabled: false}

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: opsflow-backend
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [opsflow]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: opsflow
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: opsflow
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_ready]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
